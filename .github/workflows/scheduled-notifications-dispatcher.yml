name: Scheduled Notifications Dispatcher

# Runs every 5 minutes to deliver notifications created from
# the admin panel's composer, which are written to the
# `scheduledNotifications` Firestore collection. Until this
# workflow existed, those notifications were saved to
# Firestore and never actually delivered — this closes that
# gap using the same free-tier polling approach as the
# Pending Pushes Dispatcher (no Cloud Functions / Blaze plan
# required).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}    # allows manual trigger from the Actions tab for testing

jobs:
  dispatch-scheduled-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run scheduled notifications dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/dispatchScheduledNotifications.js
